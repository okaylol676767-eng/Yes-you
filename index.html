<!DOCTYPE html>
<html>
<head>
<title>Arnu Loves You</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffb6c1, #ffc0cb, #ffd1dc);
    overflow: hidden;
    text-align: center;
    color: white;
}

h1 {
    margin-top: 20px;
    font-size: 42px;
    font-weight: 700;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 8px #fff; }
    to { text-shadow: 0 0 20px #ff1493; }
}

.slide-container {
    position: relative;
    width: 85%;
    height: 420px;
    margin: 20px auto;
}

.slide {
    position: absolute;
    width: 100%;
    opacity: 0;
    transform: scale(0.9);
    transition: all 0.6s ease;
    padding: 20px;
    line-height: 1.8;
    font-size: 18px;
}

.active {
    opacity: 1;
    transform: scale(1);
}

.teddy {
    font-size: 45px;
    margin-bottom: 10px;
}

button {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    padding: 12px 25px;
    font-size: 16px;
    margin: 10px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    background: #ff69b4;
    color: white;
    box-shadow: 0 0 15px #ff1493;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);
    background: #ff1493;
}

#indicator {
    display: inline-block;
    padding: 8px 18px;
    border-radius: 20px;
    background: #ff69b4;
    box-shadow: 0 0 15px white;
    margin-top: 10px;
    font-weight: 600;
}

.heart {
    position: absolute;
    bottom: -50px;
    font-size: 24px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-900px) rotate(360deg); opacity: 0; }
}

.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: white;
    color: #ff1493;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 30px pink;
    transition: 0.5s;
    z-index: 1000;
}

.popup.show {
    transform: translate(-50%, -50%) scale(1);
}
</style>
</head>

<body>

<h1>💖 Arnu loves you 💖</h1>
<div id="indicator">Slide 1 / 20</div>

<div class="slide-container" id="slides"></div>

<button onclick="prevSlide()">⬅ Previous</button>
<button onclick="nextSlide()">Next ➡</button>
<button onclick="toggleVoice()">🔊 Toggle Voice</button>

<div id="popup" class="popup">
<h2>🎉 Happy 15 Months Anniversary 🎉</h2>
<p>You are my everything. I love you forever and always. 💖</p>
<button onclick="closePopup()">Close 💕</button>
</div>

<script>
const messages = [
"Before you came into my life, everything felt ordinary and incomplete...",
"You filled my quiet days with laughter and happiness...",
"You brought colors into my world that I didn’t know were missing...",
"You redefined love for me and showed me trust and comfort...",
"You are my safe place and my biggest happiness...",
"You inspire me to be better every day...",
"You make ordinary moments magical...",
"You accept me completely...",
"My future feels brighter because of you...",
"You have given my life peace...",
"You are my best friend...",
"You make my heart smile...",
"You healed parts of me...",
"You gave me confidence...",
"You are my happiest memory...",
"Every heartbeat reminds me how lucky I am...",
"You turned my life into a love story...",
"With you, I believe in forever...",
"My life feels complete with you...",
"Happy 15 Months Anniversary my love. These months have been magical..."
];

const slideContainer = document.getElementById("slides");

messages.forEach((msg, index) => {
let slide = document.createElement("div");
slide.className = "slide" + (index === 0 ? " active" : "");
slide.innerHTML = "<div class='teddy'>🧸💖🧸</div>" + msg;
slideContainer.appendChild(slide);
});

let currentSlide = 0;
let slides = document.querySelectorAll(".slide");
let indicator = document.getElementById("indicator");
let popup = document.getElementById("popup");

let voiceEnabled = true;

function speak(text) {
if (!voiceEnabled) return;

window.speechSynthesis.cancel();
let speech = new SpeechSynthesisUtterance(text);
speech.rate = 0.9;
speech.pitch = 1;
speech.lang = "en-US";
window.speechSynthesis.speak(speech);
}

function showSlide(index) {
slides.forEach(slide => slide.classList.remove("active"));
slides[index].classList.add("active");
indicator.innerText = "Slide " + (index + 1) + " / " + slides.length;

speak(messages[index]);

if(index === slides.length - 1){
setTimeout(()=> popup.classList.add("show"), 1000);
}
}

function nextSlide() {
currentSlide = (currentSlide + 1) % slides.length;
showSlide(currentSlide);
}

function prevSlide() {
currentSlide = (currentSlide - 1 + slides.length) % slides.length;
showSlide(currentSlide);
}

function toggleVoice(){
voiceEnabled = !voiceEnabled;
if(!voiceEnabled) window.speechSynthesis.cancel();
}

function closePopup(){
popup.classList.remove("show");
}

/* Floating hearts */
for (let i = 0; i < 30; i++) {
let heart = document.createElement("div");
heart.className = "heart";
heart.innerHTML = "❤";
heart.style.left = Math.random() * 100 + "vw";
heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
heart.style.fontSize = (Math.random() * 20 + 10) + "px";
document.body.appendChild(heart);
}

/* Speak first slide automatically */
window.onload = () => speak(messages[0]);
</script>

</body>
</html>
