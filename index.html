<!DOCTYPE html>
<html>
<head>
<title>Arnu Loves You</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffb6c1, #ffc0cb, #ffd1dc);
    overflow: hidden;
    text-align: center;
    color: white;
}

h1 {
    margin-top: 20px;
    font-size: 40px;
    font-weight: 700;
}

.slide-container {
    position: relative;
    width: 85%;
    height: 420px;
    margin: 20px auto;
}

.slide {
    position: absolute;
    width: 100%;
    opacity: 0;
    transform: scale(0.9);
    transition: all 0.6s ease;
    padding: 20px;
    line-height: 1.8;
    font-size: 18px;
}

.active {
    opacity: 1;
    transform: scale(1);
}

.teddy {
    font-size: 40px;
    margin-bottom: 10px;
}

button {
    font-family: 'Poppins', sans-serif;
    padding: 10px 22px;
    margin: 10px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    background: #ff69b4;
    color: white;
    font-weight: 600;
}

#indicator {
    margin-top: 10px;
    font-weight: 600;
}

.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: white;
    color: #ff1493;
    padding: 30px;
    border-radius: 20px;
    transition: 0.5s;
    z-index: 1000;
}

.popup.show {
    transform: translate(-50%, -50%) scale(1);
}
</style>
</head>

<body>

<h1>💖 Arnu loves you 💖</h1>
<div id="indicator">Slide 1 / 20</div>

<div class="slide-container" id="slides"></div>

<button onclick="prevSlide()">⬅ Previous</button>
<button onclick="nextSlide()">Next ➡</button>
<button onclick="enableVoice()">🎙 Enable Voice</button>

<div id="popup" class="popup">
<h2>🎉 Happy 15 Months Anniversary 🎉</h2>
<p>You are the most beautiful part of my life. I love you forever. 💖</p>
<button onclick="closePopup()">Close</button>
</div>

<script>

const messages = [
`Before you came into my life, everything felt ordinary and predictable... (FULL long paragraph 100+ words)`,
`When you entered my world, you didn’t just bring happiness, you brought transformation... (100+ words romantic paragraph)`,
`You filled my days with laughter, warmth, and a sense of belonging...`,
`You became my safe place, my comfort, my peace...`,
`Every conversation with you feels meaningful and special...`,
`Your love has inspired me to grow and become stronger...`,
`With you, I feel understood without even speaking...`,
`You turned simple moments into unforgettable memories...`,
`I never believed in destiny until I met you...`,
`You have given my life direction and clarity...`,
`Because of you, I believe in love deeply and fearlessly...`,
`Your smile alone has the power to fix my worst days...`,
`You taught me patience, kindness, and emotional strength...`,
`Every dream I see now includes you beside me...`,
`You changed the way I see the world and myself...`,
`Loving you has been the most natural and beautiful feeling...`,
`You gave my heart a home it never knew it was searching for...`,
`My life feels complete because you are part of it...`,
`Every heartbeat reminds me how lucky I am to have you...`,
`🎉 Happy 15 Months Anniversary my love. These fifteen months have been the most beautiful journey of my life. You have filled my world with laughter, support, strength, and unconditional love. I promise to cherish you, respect you, and stand by you forever no matter what life brings our way. You are my today, my tomorrow, and my always.`
];

const container = document.getElementById("slides");

messages.forEach((msg, index) => {
let slide = document.createElement("div");
slide.className = "slide" + (index === 0 ? " active" : "");
slide.innerHTML = "<div class='teddy'>🧸💖🧸</div>" + msg;
container.appendChild(slide);
});

let currentSlide = 0;
let slides = document.querySelectorAll(".slide");
let indicator = document.getElementById("indicator");
let popup = document.getElementById("popup");

let voiceEnabled = false;
let selectedVoice = null;

function loadVoices() {
let voices = speechSynthesis.getVoices();
selectedVoice = voices.find(v => v.name.toLowerCase().includes("female")) || voices[0];
}
speechSynthesis.onvoiceschanged = loadVoices;

function speak(text) {
if (!voiceEnabled) return;
speechSynthesis.cancel();
let speech = new SpeechSynthesisUtterance(text);
speech.voice = selectedVoice;
speech.rate = 0.9;
speech.pitch = 1;
speech.lang = "en-US";
speechSynthesis.speak(speech);
}

function enableVoice(){
voiceEnabled = true;
speak(messages[currentSlide]);
}

function showSlide(index) {
slides.forEach(slide => slide.classList.remove("active"));
slides[index].classList.add("active");
indicator.innerText = "Slide " + (index + 1) + " / " + slides.length;
speak(messages[index]);

if(index === slides.length - 1){
setTimeout(()=> popup.classList.add("show"), 1000);
}
}

function nextSlide(){
currentSlide = (currentSlide + 1) % slides.length;
showSlide(currentSlide);
}

function prevSlide(){
currentSlide = (currentSlide - 1 + slides.length) % slides.length;
showSlide(currentSlide);
}

function closePopup(){
popup.classList.remove("show");
}
</script>

</body>
</html>
